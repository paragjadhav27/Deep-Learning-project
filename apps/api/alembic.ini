# For ad-hoc CLI use (e.g. `alembic revision --autogenerate -m "..."`).
# The service itself runs migrations programmatically: `facelens-api migrate`.
[alembic]
script_location = src/facelens_api/db/migrations
# sqlalchemy.url is taken from FACELENS_DATABASE_URL (see migrations/env.py)

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
