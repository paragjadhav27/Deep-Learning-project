[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "facelens-api"
version = "0.1.0"
description = "FaceLens API: privacy-first, illustrative face-image estimates behind versioned model interfaces."
readme = "README.md"
# Target runtime is 3.12 (Docker, CI); 3.11 is kept working for local development.
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  # YuNet 2026may needs the OpenCV 5 ONNX engine (dynamic input dims).
  "opencv-python-headless>=5.0,<6",
  "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Everything a production deployment needs (Postgres, S3, Celery/Redis).
prod = ["psycopg[binary]>=3.2", "boto3>=1.34", "celery[redis]>=5.4", "redis>=5"]
# Real models (MiVOLO v2). Install torch from the CPU index in Docker/CI to avoid CUDA wheels.
ml = ["torch>=2.4", "timm>=1.0.20,<2", "safetensors>=0.4"]
# Evaluation harness (eval/run_eval.py).
eval = ["facelens-api[ml]", "pyarrow>=15"]
dev = [
  "facelens-api[prod,eval]",
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "moto[s3]>=5",
  "fakeredis>=2.23",
]

[project.scripts]
facelens-api = "facelens_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/facelens_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:facelens_api.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/facelens_api/ml/vendor"]  # keep vendored code diffable against upstream

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/facelens_api/db/migrations/**" = ["N999", "INP001"]
"src/facelens_api/ml/vendor/**" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["facelens_api"]

[[tool.mypy.overrides]]
module = ["facelens_api.ml.vendor.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "celery.*", "redis.*", "moto.*", "fakeredis.*", "timm.*", "safetensors.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["facelens_api"]
known-local-folder = ["conftest"]
