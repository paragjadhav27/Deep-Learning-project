name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: facelens
          POSTGRES_PASSWORD: facelens
          POSTGRES_DB: facelens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U facelens" --health-interval 5s --health-retries 10
    env:
      FACELENS_TEST_REQUIRE_MODELS: "1"  # missing weights fail CI instead of skipping
      # Evaluation (eval/run_eval.py) is not run in CI: it takes ~2 CPU-hours. Its committed
      # report + calibration are what the registry gates on.
      FACELENS_TEST_POSTGRES_URL: postgresql+psycopg://facelens:facelens@localhost:5432/facelens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install (CPU-only PyTorch for the ml extra)
        run: pip install -e ".[dev]" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - uses: actions/cache@v4
        with:
          path: apps/api/models
          key: models-${{ hashFiles('apps/api/src/facelens_api/ml/artifacts.py') }}
      - run: facelens-api fetch-models --only yunet-2026may,mivolo-v2  # SAM (2.2 GB) is tested locally
      - run: pytest
      - name: OpenAPI snapshot is current (web types are generated from it)
        run: facelens-api export-openapi --check
      - name: Config rejects unsafe production settings
        run: |
          ! FACELENS_ENVIRONMENT=production facelens-api check-config

  api-image:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t facelens-api:ci apps/api
      - name: Image starts and passes readiness (SQLite, local storage)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e FACELENS_ENVIRONMENT=development -e FACELENS_DATABASE_URL=sqlite:////data/f.db \
            facelens-api:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && exit 0; sleep 1; done
          docker logs api; exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types match apps/api/openapi.json
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx next build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: API into apps/api/.venv (the path playwright.config.ts expects)
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
          .venv/bin/facelens-api fetch-models --only yunet-2026may
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  web-image:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t facelens-web:ci apps/web

  compose:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
